<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="Illustration of a fleet operations map with vehicle markers and status cards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#dce8ff"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3267f6"/>
      <stop offset="1" stop-color="#1b3eb0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="720" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="620" cy="70" r="120" fill="#ffffff" opacity="0.35"/>
  <circle cx="80" cy="500" r="150" fill="#bcd2ff" opacity="0.35"/>

  <g opacity="0.9">
    <path d="M40 430 L170 350 L285 382 L410 300 L545 330 L690 250" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <path d="M90 90 L180 180 L180 300 L300 420 L430 470" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <path d="M520 70 L470 190 L520 300 L650 410" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
    <path d="M40 430 L170 350 L285 382 L410 300 L545 330 L690 250" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 10"/>
  </g>

  <path d="M150 390 C230 300 275 350 350 268 S490 210 560 150" fill="none" stroke="url(#route)" stroke-width="8" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M150 390 C230 300 275 350 350 268 S490 210 560 150" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="7 9" opacity="0.85"/>

  <g filter="url(#soft)">
    <circle cx="150" cy="390" r="17" fill="#1f4edb" stroke="#ffffff" stroke-width="5"/>
    <circle cx="350" cy="268" r="17" fill="#16a34a" stroke="#ffffff" stroke-width="5"/>
    <circle cx="560" cy="150" r="17" fill="#f59e0b" stroke="#ffffff" stroke-width="5"/>
    <circle cx="470" cy="352" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
    <circle cx="255" cy="150" r="14" fill="#16a34a" stroke="#ffffff" stroke-width="4"/>
  </g>

  <g transform="translate(378 292) rotate(-12)" filter="url(#shadow)">
    <rect x="0" y="12" width="58" height="30" rx="7" fill="#1f4edb"/>
    <rect x="52" y="0" width="34" height="42" rx="7" fill="#3267f6"/>
    <rect x="58" y="7" width="22" height="16" rx="3" fill="#dce8ff"/>
    <circle cx="18" cy="44" r="9" fill="#0f172a"/>
    <circle cx="18" cy="44" r="4" fill="#cbd5e1"/>
    <circle cx="72" cy="44" r="9" fill="#0f172a"/>
    <circle cx="72" cy="44" r="4" fill="#cbd5e1"/>
  </g>

  <g transform="translate(36 40)" filter="url(#shadow)">
    <rect width="220" height="104" rx="14" fill="#ffffff"/>
    <circle cx="24" cy="26" r="6" fill="#3267f6"/>
    <rect x="38" y="21" width="98" height="9" rx="4" fill="#dde3ec"/>
    <rect x="18" y="48" width="48" height="9" rx="4" fill="#94a3b8"/>
    <text x="18" y="84" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#0f172a">16</text>
    <text x="62" y="84" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">vehicles tracked</text>
    <rect x="150" y="60" width="12" height="26" rx="3" fill="#bcd2ff"/>
    <rect x="168" y="48" width="12" height="38" rx="3" fill="#598dff"/>
    <rect x="186" y="36" width="12" height="50" rx="3" fill="#1f4edb"/>
  </g>

  <g transform="translate(470 372)" filter="url(#shadow)">
    <rect width="214" height="118" rx="14" fill="#ffffff"/>
    <circle cx="26" cy="27" r="11" fill="#fee2e2"/>
    <path d="M26 21 L26 29 M26 33 L26 34" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <rect x="46" y="20" width="112" height="9" rx="4" fill="#334155"/>
    <rect x="18" y="50" width="178" height="8" rx="4" fill="#eef1f6"/>
    <rect x="18" y="68" width="140" height="8" rx="4" fill="#eef1f6"/>
    <rect x="18" y="90" width="86" height="16" rx="8" fill="#fee2e2"/>
    <text x="30" y="102" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">3 need attention</text>
  </g>

  <g transform="translate(40 470)" filter="url(#soft)">
    <rect width="300" height="48" rx="12" fill="#ffffff" opacity="0.96"/>
    <circle cx="24" cy="24" r="6" fill="#16a34a"/>
    <text x="38" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#475569">Moving</text>
    <circle cx="116" cy="24" r="6" fill="#f59e0b"/>
    <text x="130" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#475569">Idle</text>
    <circle cx="188" cy="24" r="6" fill="#ef4444"/>
    <text x="202" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#475569">Attention</text>
  </g>
</svg>
